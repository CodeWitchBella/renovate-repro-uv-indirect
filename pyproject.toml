[project]
name = "repro"
version = "0.1.0"
requires-python = ">=3.10"
# alembic pulls in mako, which pulls in markupsafe
dependencies = ["alembic", "member"]

[tool.uv.sources]
member = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
